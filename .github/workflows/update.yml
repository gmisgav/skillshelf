name: Refresh & deploy

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_indexnow:
        description: "Submit every URL to IndexNow"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # If GitHub or the registry is down, this step fails and the last good deployment stays live.
      - name: Index skills from GitHub
        run: node scripts/fetch.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build site
        run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: sitemap
          path: dist/sitemap.xml
          retention-days: 2

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Ping Bing & co. with the pages that changed, so new skills show up in search (and ChatGPT/Copilot answers) fast.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sitemap
          path: dist
      - run: node scripts/indexnow.mjs
        env:
          FULL: ${{ (github.event_name == 'push' || inputs.full_indexnow) && '1' || '0' }}
